services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
      POSTGRES_DB: lyon_immo
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  metabase:
    image: metabase/metabase:latest
    environment:
      # Keep Metabase's own app DB on a volume so dashboards survive a container rebuild
      MB_DB_FILE: /metabase-data/metabase.db
    ports: ["3000:3000"]
    volumes: [metabase-data:/metabase-data]
    depends_on: [postgres]

volumes:
  pgdata:
  metabase-data:
